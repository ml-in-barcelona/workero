name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install binaryen
        run: npm install -g binaryen@132

      - uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: 5.4.0
          with-dev-setup: true
          with-doc: true
          extra-packages: dune-release mlx ocamlformat-mlx

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.1.0

      - name: Build
        run: opam exec -- dune build

      - name: Install workerd
        run: npm install -g workerd

      - name: Prepare container test images
        run: |
          docker build -t workero-test-httpd:1 test/worker-containers
          docker pull cloudflare/proxy-everything@sha256:0e2e951e947d3ec57f29afdb873dde0530fdf3f719bdca2a6a4d65b8e7fe0a41
          docker tag cloudflare/proxy-everything@sha256:0e2e951e947d3ec57f29afdb873dde0530fdf3f719bdca2a6a4d65b8e7fe0a41 cloudflare/proxy-everything:510e5ce

      - name: Test
        env:
          WORKERO_REQUIRE_CONTAINERS: '1'
        run: make test

      - name: Check formatting
        run: opam exec -- dune build @fmt

      - name: Build example worker
        run: opam exec -- dune exec workero -- build examples/basic/main.bc.wasm.js

      - name: Check docs/ is up to date
        run: |
          make docs DUNE="opam exec -- dune"
          git add --intent-to-add docs
          git diff --exit-code -- docs

      - name: Upload HTML docs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/default/_doc/_html

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.1.0

      - name: Lint
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: workero

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: davesnx/dune-release-action@v0.5.0
        with:
          packages: workero
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN }}

  docs:
    name: Deploy docs
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
