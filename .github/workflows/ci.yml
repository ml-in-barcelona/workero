name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install binaryen
        run: npm install -g binaryen@132

      - uses: ml-in-barcelona/gh-ci-action@v1
        with:
          ocaml-compiler: 5.4.0
          with-test: false
          extra-packages: ocamlformat.0.29.0 dune-release mlx ocamlformat-mlx

      - name: Install extra packages
        run: opam install ocamlformat.0.29.0 dune-release mlx ocamlformat-mlx -y

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1

      - name: Build
        run: opam exec -- dune build

      - name: Check formatting
        run: opam exec -- dune build @fmt

      - name: Build example worker
        run: opam exec -- dune exec workero -- build examples/basic/main

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1
        if: ${{ !cancelled() }}

      - name: Lint
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: workero

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: davesnx/dune-release-action@v0.5.0
        with:
          packages: workero
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN }}
