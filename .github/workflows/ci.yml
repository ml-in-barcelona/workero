name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install binaryen
        run: npm install -g binaryen@132

      - uses: ml-in-barcelona/gh-ci-action@v1
        with:
          ocaml-compiler: 5.4.0
          with-dev-setup: true

      - name: Load dune-release cache
        id: dune-release-cache
        uses: actions/cache@v4
        with:
          path: ~/dune-release-bin
          key: dune-release-${{ runner.os }}-${{ runner.arch }}-5.4.0

      - name: Install dune-release
        if: steps.dune-release-cache.outputs.cache-hit != 'true'
        run: |
          opam switch create dune-release ocaml-base-compiler.5.4.0 --no-switch -y
          opam install --switch=dune-release dune-release -y
          mkdir -p ~/dune-release-bin
          cp "$(opam var --switch=dune-release bin)/dune-release" ~/dune-release-bin/

      - run: echo ~/dune-release-bin >> "$GITHUB_PATH"

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1

      - name: Build
        run: opam exec -- dune build

      - name: Check formatting
        run: opam exec -- dune build @fmt

      - name: Build example worker
        run: opam exec -- dune exec workero -- build example/main

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1
        if: ${{ !cancelled() }}

      - name: Lint
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: workero

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: davesnx/dune-release-action@v0.5.0
        with:
          packages: workero
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN }}
